name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.route.outputs.build }}
    steps:
      - if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: route
        shell: bash
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]]; then
            tags=$(git tag --points-at "$GITHUB_SHA" --list '[0-9]*.[0-9]*.[0-9]*')
            # Let the tag run build and publish when main and a tag arrive together.
            if [[ -n "$tags" ]]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Format, compile and test
        run: make check V=.tools/v/v
      - name: Package the tested Linux binary
        run: |
          tar -czf keeper-vault-linux-x86_64.tar.gz keeper-vault
          sha256sum keeper-vault-linux-x86_64.tar.gz > keeper-vault-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            keeper-vault-linux-x86_64.tar.gz
            keeper-vault-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c keeper-vault-linux-x86_64.tar.gz.sha256
          gh release create "$TAG" --verify-tag --generate-notes keeper-vault-linux-x86_64.tar.gz{,.sha256}
