name: Build and release
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Format, compile and test
        run: make check V=.tools/v/v BROWSER="$(command -v google-chrome)"
      - name: Package the tested Linux binary
        run: |
          tar -czf keeper-vault-linux-x86_64.tar.gz keeper-vault
          sha256sum keeper-vault-linux-x86_64.tar.gz > keeper-vault-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            keeper-vault-linux-x86_64.tar.gz
            keeper-vault-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c keeper-vault-linux-x86_64.tar.gz.sha256
          gh release create "$TAG" --verify-tag --generate-notes keeper-vault-linux-x86_64.tar.gz{,.sha256}
