<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Keeper Vault</title>
  <!-- styles -->
  <meta name="vault-key" content="__TOKEN__" />
  <header>
    <div>
      <span class="gem" aria-hidden="true"></span>Keeper Vault<span
        id="game-controls"
      ></span>
    </div>
  </header>
  <main>
    <h1>Save library</h1>
    <p id="profilePath"></p>
    <nav aria-label="Filter saves"></nav>
    <div id="msg" role="status"></div>
    <section id="checkpoint-panel" aria-labelledby="checkpoint-heading">
      <h2 id="checkpoint-heading" hidden>Checkpoints</h2>
      <p class="detail">
        A checkpoint is a restore point for a world, a character, or both.
        Include both to back them up or restore them together in one action.
        Save and quit before creating one.
      </p>
      <div id="checkpoints"></div>
      <div id="checkpoint-status" role="status"></div>
    </section>
    <section hidden id="list" aria-label="Saves"></section>
  </main>
  <dialog id="modal">
    <form method="dialog">
      <h2></h2>
      <p></p>
      <textarea maxlength="1000" rows="4" aria-label="Note"></textarea>
      <footer>
        <button value="cancel" formnovalidate>Cancel</button
        ><button value="ok" class="primary">Save</button>
      </footer>
    </form>
  </dialog>
  <!-- app -->
</html>
